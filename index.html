<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>О-го-го кишенька</title>
    <link rel="stylesheet" href="style.css"> <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

    <div class="header">
        <h1 id="pageTitle">Джерела</h1>
    </div>

    <div id="sourcesTab" class="container active">
        <div class="card">
            <h2>Створити джерело</h2>
            <input type="text" id="sourceName" placeholder="Назва (напр., Картка Приват)">
            <input type="text" id="sourceDesc" placeholder="Опис (напр., Зарплатна)">
            <input type="number" id="sourceInitBalance" placeholder="Початковий баланс (грн)">
            <button class="btn btn-blue" style="width: 100%;" onclick="addSource()">Додати джерело</button>
        </div>
        <h3 style="margin-left: 5px; color: var(--text-muted);">Мої активи</h3>
        <div id="sourcesList"></div>
    </div>

    <div id="operationsTab" class="container">
        <div class="card">
            <h2>Нова транзакція</h2>
            <select id="opSourceSelect"><option value="">-- Виберіть джерело --</option></select>
            <input type="text" id="opDesc" placeholder="За що? (напр., Продукти, Зарплата)">
            <input type="number" id="opAmount" placeholder="Сума (грн)">
            <div class="btn-group">
                <button class="btn btn-red" onclick="addTransaction('expense', false)">Витрата (-)</button>
                <button class="btn btn-green" onclick="addTransaction('income', false)">Дохід (+)</button>
            </div>
        </div>
    </div>

    <div id="debtsTab" class="container">
        <div class="total-badge text-orange" id="totalDebtsLabel">Нам винні: 0 ₴</div>
        <div class="card">
            <h2>Дати в борг</h2>
            <input type="text" id="debtPerson" placeholder="Кому даємо?">
            <select id="debtSourceSelect"><option value="">-- Звідки знімаємо гроші? --</option></select>
            <input type="number" id="debtAmount" placeholder="Сума (грн)">
            <button class="btn btn-orange" style="width: 100%;" onclick="addDebt()">Видати борг</button>
        </div>
        <h3 style="margin-left: 5px; color: var(--text-muted);">Активні борги</h3>
        <div id="debtsList"></div>
    </div>

    <div id="monitoringTab" class="container">
        <div class="card" style="margin-bottom: 5px; padding: 15px;">
            <div class="filters-grid">
                <select id="monFilterSource" onchange="renderMonitoring()"><option value="all">Усі джерела</option></select>
                <select id="monFilterType" onchange="renderMonitoring()">
                    <option value="all">Усі операції</option>
                    <option value="income">Тільки Доходи</option>
                    <option value="expense">Тільки Витрати</option>
                </select>
                <select id="monSort" onchange="renderMonitoring()">
                    <option value="dateDesc">За датою (найновіші)</option>
                    <option value="dateAsc">За датою (найстаріші)</option>
                    <option value="amountDesc">За сумою (найбільші)</option>
                    <option value="amountAsc">За сумою (найменші)</option>
                </select>
            </div>
        </div>
        <div class="total-badge text-blue" id="monTotalBalance">0 ₴</div>
        <div id="monitoringList"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" id="nav-sourcesTab" onclick="switchTab('sourcesTab', 'Джерела')">
            <span class="nav-icon">💳</span><span>Джерела</span>
        </div>
        <div class="nav-item" id="nav-operationsTab" onclick="switchTab('operationsTab', 'Операції')">
            <span class="nav-icon">💸</span><span>Операції</span>
        </div>
        <div class="nav-item" id="nav-debtsTab" onclick="switchTab('debtsTab', 'Борги')">
            <span class="nav-icon">🤝</span><span>Борги</span>
        </div>
        <div class="nav-item" id="nav-monitoringTab" onclick="switchTab('monitoringTab', 'Моніторинг')">
            <span class="nav-icon">📊</span><span>Моніторинг</span>
        </div>
    </div>

    <div class="modal-overlay" id="editSourceModal" onclick="if(event.target===this) closeEditModal()">
        <div class="modal-sheet">
            <div class="card-header">
                <h2>Налаштування джерела</h2>
                <button class="edit-icon" style="color: var(--text-muted); background:none; font-size:20px;" onclick="closeEditModal()">✕</button>
            </div>
            <input type="hidden" id="editSourceId">
            <input type="text" id="editSourceName" placeholder="Назва джерела">
            <input type="text" id="editSourceDesc" placeholder="Опис">
            <label style="font-size:12px; color:var(--text-muted); margin-left:5px;">Початковий баланс</label>
            <input type="number" id="editSourceBalance" placeholder="Початковий баланс">
            
            <button class="btn btn-blue" style="width: 100%; margin-bottom: 12px;" onclick="saveEditedSource()">Зберегти зміни</button>
            <button class="btn btn-outline-red" style="width: 100%;" onclick="deleteSource()">🗑 Видалити джерело</button>
        </div>
    </div>

    <div class="modal-overlay" id="repayModal" onclick="if(event.target===this) closeRepayModal()">
        <div class="modal-sheet">
            <div class="card-header">
                <h2>Повернення боргу</h2>
                <button class="edit-icon" style="color: var(--text-muted); background:none; font-size:20px;" onclick="closeRepayModal()">✕</button>
            </div>
            <p id="repayPersonName" style="margin-top: 0; margin-bottom: 20px; font-weight: 500; color: var(--blue);"></p>
            <input type="number" id="repayAmount" placeholder="Скільки повертають? (грн)">
            <select id="repaySourceSelect"><option value="">-- Куди зарахувати гроші? --</option></select>
            <button class="btn btn-green" style="width: 100%;" onclick="confirmRepay()">Зарахувати</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
